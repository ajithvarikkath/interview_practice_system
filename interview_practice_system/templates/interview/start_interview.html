{% extends 'base.html' %}

{% block title %}Interview Question{% endblock %}

{% block active_interview %}active{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>{{ question.category.name }}</h3>

        </div>

        <div class="card-body">

            <h4>{{ question.question_text }}</h4>

            <hr>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">

                    Submit Answer

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
