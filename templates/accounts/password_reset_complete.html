{% extends 'base.html' %}

{% block title %}Reset Password Complete - AI Interview Prep{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card glass-card w-100 p-4 shadow-lg text-center" style="max-width: 450px;">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3 mb-3 mx-auto" style="background: rgba(16, 185, 129, 0.15);">
            <i class="bi bi-patch-check-fill fs-2" style="color: var(--accent-emerald);"></i>
        </div>
        <h2 class="h3 mb-2 font-brand">Password Reset Complete</h2>
        <p class="text-secondary small mb-4">
            Your password has been successfully set. You may now log in using your new password.
        </p>
        <div class="mt-3 pt-3 border-top" style="border-color: var(--border-color) !important;">
            <a href="{% url 'accounts:login' %}" class="btn btn-gradient w-100">Sign In Now</a>
        </div>
    </div>
</div>
{% endblock %}
